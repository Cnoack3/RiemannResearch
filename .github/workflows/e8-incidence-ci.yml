name: E8 Incidence CI

on:
  push:
    branches:
      - serreii-e8-incidence
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-incidence:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Set up Lean and caches
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: true
      - name: Build the E8 positive-root incidence module
        shell: bash
        run: |
          set -o pipefail
          lake build RiemannResearch.E8.PositiveRootIncidence --quiet 2>&1 | tee e8-incidence-build.log
      - name: Preserve Lean diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e8-incidence-build-log
          path: e8-incidence-build.log
          if-no-files-found: warn
