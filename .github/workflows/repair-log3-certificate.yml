name: Repair log-three certificate source

on:
  push:
    branches:
      - rh-prime-gap-curvature-lean
    paths:
      - '.github/workflows/repair-log3-certificate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: rh-prime-gap-curvature-lean
      - name: Replace compiler-trust tactic by kernel reduction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('RiemannResearch/RH/Log3IntervalCertificate.lean')
          text = path.read_text()
          text = text.replace('import Mathlib.Tactic.NativeDecide\n', '')
          text = text.replace('  native_decide\n', '  decide\n')
          path.write_text(text)
          PY
      - name: Commit repair
        run: |
          git config user.name 'Lean Research Agent'
          git config user.email 'lean-agent@localhost'
          git add RiemannResearch/RH/Log3IntervalCertificate.lean
          git diff --cached --quiet || git commit -m 'Use kernel reduction for rational log-three margins'
          git push origin HEAD:rh-prime-gap-curvature-lean
