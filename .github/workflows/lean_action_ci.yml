name: Lean Action CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Superseded PRs can stop; main and explicit base audits finish their running job.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LEAN_NUM_THREADS: 8

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        id: checkout
        with:
          fetch-depth: 0
      - name: Classify changes and record initial resources
        id: changes
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 tools/ci_lean.py classify
      - name: Install MCP workspace tooling dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep
      - name: Validate MCP workspace tooling
        id: tooling
        run: |
          python3 -m py_compile tools/lean_workspace_mcp.py tools/agent_workspaces.py tools/ci_lean.py
          python3 tools/test_agent_workspaces.py
          python3 -m unittest discover -s tools -p 'test_*.py'

      # Exact dependency identity: OS/architecture, compiler, options and manifest.
      # Keep the early preflight snapshot even if the later library build fails.
      # PRs are restore-only; only main push/manual jobs can promote artifacts.
      - name: Restore dependency artifacts
        id: dependencies
        if: steps.changes.outputs.lean_required == 'true'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .lake/packages
          key: lean-deps-complete-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lakefile.lean', 'lake-manifest.json') }}
          restore-keys: lean-deps-preflight-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lakefile.lean', 'lake-manifest.json') }}
      - name: Install Lean and prepare the dependency cache
        id: preflight
        if: steps.changes.outputs.lean_required == 'true'
        uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # inspected v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: false
      - name: Save prepared dependencies immediately
        if: steps.changes.outputs.lean_required == 'true' && steps.dependencies.outputs.cache-matched-key == '' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .lake/packages
          key: lean-deps-preflight-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lakefile.lean', 'lake-manifest.json') }}
      - name: Restore previously verified project outputs
        id: project
        if: steps.changes.outputs.lean_required == 'true'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .lake/build
          key: lean-project-library-quiet-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lakefile.lean', 'lake-manifest.json') }}-${{ steps.changes.outputs.lean_source_sha256 }}
          restore-keys: lean-project-library-quiet-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lakefile.lean', 'lake-manifest.json') }}-
      - name: Build the RiemannResearch library
        id: lean_build
        if: steps.changes.outputs.lean_required == 'true'
        run: lake build RiemannResearch --quiet
      - name: Save completed dependency artifacts
        if: steps.changes.outputs.lean_required == 'true' && steps.dependencies.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .lake/packages
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      - name: Save verified project outputs
        if: steps.changes.outputs.lean_required == 'true' && steps.project.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .lake/build
          key: ${{ steps.project.outputs.cache-primary-key }}

      - name: Record verification provenance and final resources
        if: always() && steps.checkout.outcome == 'success'
        env:
          CI_CLASSIFICATION_OUTCOME: ${{ steps.changes.outcome }}
          CI_TOOLING_OUTCOME: ${{ steps.tooling.outcome }}
          CI_LEAN_OUTCOME: ${{ steps.lean_build.outcome }}
          CI_LEAN_REQUIRED: ${{ steps.changes.outputs.lean_required }}
          CI_DEPENDENCY_CACHE: ${{ steps.dependencies.outputs.cache-matched-key }}
          CI_PROJECT_CACHE: ${{ steps.project.outputs.cache-matched-key }}
        run: python3 tools/ci_lean.py receipt
      - name: Retain compact verification receipt
        if: always() && steps.checkout.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lean-ci-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lean-ci-receipt.json
          if-no-files-found: warn
      - name: Verification gate
        if: always()
        env:
          CLASSIFICATION_OUTCOME: ${{ steps.changes.outcome }}
          TOOLING_OUTCOME: ${{ steps.tooling.outcome }}
          LEAN_REQUIRED: ${{ steps.changes.outputs.lean_required }}
          LEAN_OUTCOME: ${{ steps.lean_build.outcome }}
        run: |
          test "$CLASSIFICATION_OUTCOME" = success
          test "$TOOLING_OUTCOME" = success
          if [ "$LEAN_REQUIRED" = true ]; then
            test "$LEAN_OUTCOME" = success
          else
            test "$LEAN_REQUIRED" = false
            test "$LEAN_OUTCOME" = skipped
            echo 'Documentation-only PR: Lean was not run; tooling checks passed.'
          fi
