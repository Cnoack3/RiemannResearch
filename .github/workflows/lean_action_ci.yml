name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Install workspace test dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Validate MCP workspace tooling
        run: |
          python3 -m py_compile tools/lean_workspace_mcp.py tools/agent_workspaces.py
          python3 tools/test_agent_workspaces.py
      - name: Build the RiemannResearch library
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: true
          build-args: "RiemannResearch --quiet"
