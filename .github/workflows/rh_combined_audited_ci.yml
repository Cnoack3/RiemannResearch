name: RH Combined Audited CI

on:
  push:
    paths:
      - "RiemannResearch/RH/CombinedAuditedCore.lean"
      - "RiemannResearch/RH/CombinedAuditedInventory.lean"
      - "RiemannResearch/RH/CombinedGain.lean"
      - ".github/workflows/rh_combined_audited_ci.yml"
  pull_request:
    paths:
      - "RiemannResearch/RH/CombinedAuditedCore.lean"
      - "RiemannResearch/RH/CombinedAuditedInventory.lean"
      - "RiemannResearch/RH/CombinedGain.lean"
      - ".github/workflows/rh_combined_audited_ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build audited RH modules
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: true
          build-args: "RiemannResearch.RH.CombinedAuditedCore RiemannResearch.RH.CombinedAuditedInventory RiemannResearch.RH.CombinedGain --quiet"
