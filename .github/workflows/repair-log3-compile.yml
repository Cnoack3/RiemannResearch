name: Repair log-three Lean compilation

on:
  push:
    branches:
      - rh-prime-gap-curvature-lean
    paths:
      - '.github/workflows/repair-log3-compile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: rh-prime-gap-curvature-lean
      - name: Patch Lean proofs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('RiemannResearch/RH/Log3IntervalCertificate.lean')
          text = path.read_text()

          text = text.replace(
              'import Mathlib.LinearAlgebra.Matrix.NonsingularInverse\n',
              'import Mathlib.LinearAlgebra.Matrix.NonsingularInverse\n'
              'import Mathlib.Tactic.FinCases\n'
              'import Mathlib.Tactic.NormNum\n',
          )

          text = text.replace(
              '''  intro i j hji
          simp [unitUpper, (ne_of_gt hji).symm, not_lt_of_ge hji.le]
          ''',
              '''  intro i j hji
          change j < i at hji
          simp only [unitUpper]
          rw [if_neg (ne_of_gt hji).symm, if_neg (not_lt_of_ge hji.le)]
          ''',
          )

          text = text.replace(
              '''  rw [Matrix.det_of_isUpperTriangular _ (unitUpper_isUpperTriangular c)]
          simp
          ''',
              '''  rw [Matrix.det_of_isUpperTriangular (unitUpper_isUpperTriangular c)]
          simp
          ''',
          )

          old = '''theorem posDef_of_congruence_posDef
              {A Q : Matrix n n ℝ}
              (hA : A.IsHermitian)
              (hQ : Function.Surjective Q.mulVec)
              (hcong : (congruence Q A).PosDef) :
              A.PosDef := by
            refine Matrix.PosDef.of_dotProduct_mulVec_pos hA ?_
            intro x hx
            obtain ⟨y, hy⟩ := hQ x
            have hy0 : y ≠ 0 := by
              intro hzero
              apply hx
              rw [← hy, hzero, Matrix.mulVec_zero]
            have hp := hcong.dotProduct_mulVec_pos hy0
            rw [← hy]
            simpa [congruence, ← Matrix.mulVec_mulVec,
              dotProduct_mulVec _ _ (Q *ᵥ y), star_eq_conjTranspose,
              vecMul_conjTranspose] using hp
          '''
          new = '''theorem posDef_of_congruence_posDef
              {A Q : Matrix n n ℝ}
              (_hA : A.IsHermitian)
              (hQ : Function.Surjective Q.mulVec)
              (hcong : (congruence Q A).PosDef) :
              A.PosDef := by
            have hunit : IsUnit Q :=
              Matrix.mulVec_surjective_iff_isUnit.mp hQ
            apply (hunit.posDef_star_left_conjugate_iff (x := A)).mp
            simpa [congruence, star_eq_conjTranspose] using hcong
          '''
          if old not in text:
              raise SystemExit('congruence proof block not found')
          text = text.replace(old, new)

          text = text.replace(
              '''theorem evenRationalMarginsPositive :
              ∀ i, evenRowRadiusQ i < evenDiagLowerQ i := by
            decide
          ''',
              '''theorem evenRationalMarginsPositive :
              ∀ i, evenRowRadiusQ i < evenDiagLowerQ i := by
            intro i
            fin_cases i <;> norm_num [evenRowRadiusQ, evenDiagLowerQ]
          ''',
          )

          text = text.replace(
              '''theorem oddRationalMarginsPositive :
              ∀ i, oddRowRadiusQ i < oddDiagLowerQ i := by
            decide
          ''',
              '''theorem oddRationalMarginsPositive :
              ∀ i, oddRowRadiusQ i < oddDiagLowerQ i := by
            intro i
            fin_cases i <;> norm_num [oddRowRadiusQ, oddDiagLowerQ]
          ''',
          )

          path.write_text(text)
          PY
      - name: Commit repair
        run: |
          git config user.name 'Lean Research Agent'
          git config user.email 'lean-agent@localhost'
          git add RiemannResearch/RH/Log3IntervalCertificate.lean
          git diff --cached --quiet || git commit -m 'Repair exact log-three certificate proofs'
          git push origin HEAD:rh-prime-gap-curvature-lean
