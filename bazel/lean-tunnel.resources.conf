# Aggregate local-memory policy for the approximately 14 GiB WSL host.
# Install as /etc/systemd/system/lean-tunnel.service.d/90-bazel-resources.conf
# Keep remote actions and independent workspaces concurrent. Memory limits
# include the MCP process, its Bazel JVMs, local Lean processes and fetchers.
[Service]
Environment=LEAN_BAZEL_JOB_WORKERS=0
Environment=LEAN_WORKSPACE_THREADS=2
Environment=LEAN_LAKE_BUILD_THREADS=2
Environment=LEAN_MAX_SHARED_CLIENTS=2
MemoryAccounting=yes
MemoryHigh=8G
MemoryMax=10G
MemorySwapMax=1G
OOMPolicy=stop
